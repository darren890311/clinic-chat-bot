name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      # The OWNER role runs migrations.
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/clinic
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinic
      # The APPLICATION role is a separate non-owner. The isolation tests are
      # meaningless unless they run as this role: a superuser bypasses row level
      # security entirely and every assertion would pass while protecting nothing.
      DATABASE_URL: postgresql+asyncpg://clinic_app:ci_password@localhost:5432/clinic
      TEST_APP_DATABASE_URL: postgresql://clinic_app:ci_password@localhost:5432/clinic

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Create the application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d clinic \
               -v app_password=ci_password -f backend/scripts/bootstrap_roles.sql

      - name: Migrate
        working-directory: backend
        run: alembic upgrade head

      - name: Lint
        working-directory: backend
        run: ruff check app scripts tests && ruff format --check app scripts tests

      - name: Test
        working-directory: backend
        run: pytest -q

      - name: Seed smoke test
        working-directory: backend
        run: python -m scripts.seed --slug ci-clinic --name "CI Clinic"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t clinic-chat-bot:${{ github.sha }} .
