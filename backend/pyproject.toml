[project]
name = "clinic-chat-bot"
version = "0.1.0"
description = "Appointment scheduling assistant for a dental clinic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "cryptography>=43.0",
    "python-multipart>=0.0.17",
    "psycopg[binary]>=3.2",
    "greenlet>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "time-machine>=2.16",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Our own deprecations should fail the build.
    "error::DeprecationWarning",
    # Starlette's TestClient reaches for an anyio alias that anyio has since
    # deprecated. Not ours to fix, and not worth losing the strict rule over.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends()/Query() in argument defaults is FastAPI's intended idiom, not the
# mutable-default bug B008 is written to catch.
"app/api/*.py" = ["B008"]
